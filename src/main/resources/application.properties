spring.application.name=NoteDemo

# Base de données : en production (Render + Aiven) ces valeurs viennent de variables d'environnement.
# Les valeurs après ':' sont les réglages locaux par défaut (aucun secret de production dans le dépôt).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notedemo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

# Render impose le port d'écoute via la variable PORT
server.port=${PORT:8080}

# Mots de passe des deux comptes de démonstration (modifiables sans recompiler)
app.demo.ali-password=${DEMO_ALI_PASSWORD:prof1}
app.demo.sonia-password=${DEMO_SONIA_PASSWORD:prof2}
# Webservice d'examens : interne (ExamenSourceController) aujourd'hui, pointera vers un vrai système
# universitaire plus tard sans changer de code, juste cette URL.
app.examens.source-url=${EXAMENS_SOURCE_URL:http://localhost:${server.port}/webservice/examens}
